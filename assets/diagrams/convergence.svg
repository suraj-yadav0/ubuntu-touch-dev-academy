<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="100%" height="100%">
  <defs>
    <style>
      .box { rx: 6; stroke-width: 1.5; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #d1d5db; }
      .accent { fill: #e95420; }
    </style>
  </defs>

  <rect width="860" height="420" fill="#181a1f" rx="12"/>

  <!-- Phone Form Factor (Left) -->
  <rect x="30" y="30" width="180" height="360" rx="20" fill="#242831" stroke="#e95420" stroke-width="2"/>
  <rect x="42" y="55" width="156" height="310" rx="8" fill="#13151a"/>
  <!-- Phone App UI -->
  <rect x="42" y="55" width="156" height="30" fill="#e95420" rx="4"/>
  <text x="50" y="75" class="title" font-size="11">Notes (Page 1)</text>
  <rect x="48" y="95" width="144" height="24" rx="4" fill="#292e39"/>
  <rect x="48" y="125" width="144" height="24" rx="4" fill="#292e39"/>
  <rect x="48" y="155" width="144" height="24" rx="4" fill="#292e39"/>
  <rect x="48" y="185" width="144" height="24" rx="4" fill="#292e39"/>
  <text x="35" y="405" class="title">1. Phone (1 Column)</text>
  <text x="35" y="418" class="desc">PageStack push/pop navigation</text>

  <!-- Tablet Form Factor (Middle) -->
  <rect x="240" y="50" width="280" height="320" rx="16" fill="#242831" stroke="#3b82f6" stroke-width="2"/>
  <rect x="252" y="68" width="256" height="284" rx="6" fill="#13151a"/>
  <!-- Tablet App UI: 2 columns -->
  <rect x="252" y="68" width="256" height="28" fill="#1d4ed8" rx="4"/>
  <text x="260" y="87" class="title" font-size="11">AdaptivePageLayout (Dual Column)</text>
  <!-- Left column list -->
  <rect x="258" y="104" width="95" height="240" fill="#1f242d" rx="4"/>
  <rect x="262" y="112" width="87" height="18" fill="#374151" rx="3"/>
  <rect x="262" y="136" width="87" height="18" fill="#e95420" rx="3"/>
  <rect x="262" y="160" width="87" height="18" fill="#374151" rx="3"/>
  <!-- Right column detail -->
  <rect x="360" y="104" width="142" height="240" fill="#292e39" rx="4"/>
  <text x="368" y="125" class="title" font-size="11">Note Editor</text>
  <rect x="368" y="135" width="126" height="8" fill="#4b5563" rx="2"/>
  <rect x="368" y="148" width="100" height="8" fill="#4b5563" rx="2"/>
  <text x="250" y="390" class="title">2. Tablet (2 Columns)</text>
  <text x="250" y="405" class="desc">AdaptivePageLayout layout: 2</text>

  <!-- Desktop Converged Form Factor (Right) -->
  <rect x="550" y="30" width="280" height="340" rx="12" fill="#242831" stroke="#10b981" stroke-width="2"/>
  <rect x="560" y="45" width="260" height="26" fill="#065f46" rx="4"/>
  <text x="570" y="62" class="title" font-size="11">Ubuntu Touch Desktop Window</text>
  <!-- Window Controls -->
  <circle cx="795" cy="58" r="4" fill="#fbbf24"/>
  <circle cx="807" cy="58" r="4" fill="#ef4444"/>
  <!-- Desktop 3 column or full pane -->
  <rect x="560" y="77" width="70" height="280" fill="#1f242d"/>
  <rect x="635" y="77" width="90" height="280" fill="#292e39"/>
  <rect x="730" y="77" width="90" height="280" fill="#1a1e26"/>
  <text x="560" y="390" class="title">3. Desktop Monitor Mode</text>
  <text x="560" y="405" class="desc">External display plug &amp; mouse/keyboard</text>
</svg>
