<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <style>
      .box { rx: 8; stroke-width: 2; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #d1d5db; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
      .flow-arrow { stroke: #e95420; stroke-width: 3; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#e95420" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" fill="#181a1f" rx="12"/>

  <!-- Left: GNU/Linux Userspace (glibc) -->
  <rect x="30" y="30" width="370" height="420" rx="10" fill="#20242c" stroke="#3b82f6" stroke-width="2"/>
  <text x="50" y="65" class="title" fill="#60a5fa">GNU/Linux Userspace (glibc)</text>
  <text x="50" y="85" class="desc">Standard GNU C Library ecosystem</text>

  <!-- Mir Compositor Box -->
  <rect x="50" y="110" width="330" height="60" class="box" fill="#2a303c" stroke="#3b82f6"/>
  <text x="65" y="135" class="title">Mir 2.x / Qt Applications</text>
  <text x="65" y="155" class="desc">Compiled against glibc, requesting OpenGL ES</text>

  <!-- Hybris Translation Client -->
  <rect x="50" y="210" width="330" height="90" class="box" fill="#1e3a5f" stroke="#60a5fa"/>
  <text x="65" y="235" class="title">libhybris Frontend (eglhybris, glesv2)</text>
  <text x="65" y="255" class="desc">Exposes standard Khronos EGL/GLES ABI to Qt/Mir.</text>
  <text x="65" y="275" class="desc">Intercepts function calls and marshals arguments.</text>

  <!-- libhybris dynamic linker -->
  <rect x="50" y="330" width="330" height="90" class="box" fill="#2a2238" stroke="#a855f7"/>
  <text x="65" y="355" class="title">libhybris Linker Wrapper</text>
  <text x="65" y="375" class="desc">Emulates Android Bionic dynamic linker (linker64).</text>
  <text x="65" y="395" class="desc">Loads /vendor/lib64/* without crashing glibc TLS/heap.</text>

  <!-- Right: Android Hardware Layer (Bionic) -->
  <rect x="460" y="30" width="370" height="420" rx="10" fill="#29231f" stroke="#f97316" stroke-width="2"/>
  <text x="480" y="65" class="title" fill="#fb923c">Android HAL &amp; Vendor Blobs (Bionic)</text>
  <text x="480" y="85" class="desc">Proprietary board support packages (BSP)</text>

  <!-- Android Bionic Driver -->
  <rect x="480" y="110" width="330" height="75" class="box" fill="#382920" stroke="#f97316"/>
  <text x="495" y="135" class="title">libGLES_mali / libGLES_adreno.so</text>
  <text x="495" y="155" class="desc">Compiled against Android Bionic libc.</text>
  <text x="495" y="172" class="desc">Expects Android thread-local storage (TLS).</text>

  <!-- Android Hardware Abstraction Layers -->
  <rect x="480" y="210" width="330" height="95" class="box" fill="#382920" stroke="#f97316"/>
  <text x="495" y="235" class="title">Android HAL Libraries</text>
  <text x="495" y="255" class="desc">gralloc.default.so (Buffer allocation)</text>
  <text x="495" y="275" class="desc">hwcomposer.so (Display sync / VSYNC)</text>
  <text x="495" y="292" class="desc">camera.device.so, audio.primary.so</text>

  <!-- Linux Kernel DRM / KGSL / Binder -->
  <rect x="480" y="330" width="330" height="90" class="box" fill="#2d3748" stroke="#94a3b8"/>
  <text x="495" y="355" class="title">Kernel Drivers &amp; IOCTLs</text>
  <text x="495" y="375" class="desc">/dev/kgsl-3d0, /dev/ion, /dev/dma_buf</text>
  <text x="495" y="395" class="desc">Direct hardware communication to GPU / Modem</text>

  <!-- Connecting bridge arrows -->
  <path d="M 380 255 L 470 145" class="flow-arrow"/>
  <path d="M 380 375 L 470 255" class="flow-arrow"/>
</svg>
