<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" height="100%">
  <defs>
    <style>
      .box { rx: 8; stroke-width: 2; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e0e0e0; }
      .text-note { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #9e9e9e; font-style: italic; }
      .layer-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; text-anchor: middle; letter-spacing: 1px; }
      .arrow { stroke: #e95420; stroke-width: 2.5; stroke-dasharray: 4,4; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e95420" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="640" fill="#1b1c20" rx="12"/>

  <!-- Layer 1: User Experience / Applications -->
  <rect x="30" y="25" width="840" height="95" rx="10" fill="#262830" stroke="#77216f" stroke-width="1.5" />
  <text x="50" y="48" class="layer-title" fill="#c05cb8">USER EXPERIENCE &amp; APPLICATIONS</text>

  <rect x="50" y="60" width="175" height="48" class="box" fill="#383a45" stroke="#77216f" />
  <text x="60" y="80" class="text-title">Native QML / Qt Apps</text>
  <text x="60" y="96" class="text-sub">Lomiri.Components UI</text>

  <rect x="245" y="60" width="175" height="48" class="box" fill="#383a45" stroke="#77216f" />
  <text x="255" y="80" class="text-title">PyOtherSide Apps</text>
  <text x="255" y="96" class="text-sub">Python 3 + QML Logic</text>

  <rect x="440" y="60" width="175" height="48" class="box" fill="#383a45" stroke="#77216f" />
  <text x="450" y="80" class="text-title">Morph Webapps</text>
  <text x="450" y="96" class="text-sub">QtWebEngine Container</text>

  <rect x="635" y="60" width="215" height="48" class="box" fill="#383a45" stroke="#77216f" />
  <text x="645" y="80" class="text-title">Waydroid (Android Apps)</text>
  <text x="645" y="96" class="text-sub">LXC LineageOS Container</text>

  <!-- Layer 2: Desktop Environment / Shell -->
  <rect x="30" y="135" width="840" height="100" rx="10" fill="#262830" stroke="#e95420" stroke-width="1.5" />
  <text x="50" y="158" class="layer-title" fill="#ea6f43">LOMIRI USER SHELL &amp; SYSTEM SERVICES</text>

  <rect x="50" y="170" width="235" height="52" class="box" fill="#383a45" stroke="#e95420" />
  <text x="60" y="191" class="text-title">Lomiri Shell (QtQuick/QML)</text>
  <text x="60" y="209" class="text-sub">Edge Gestures, Launcher, App Drawer</text>

  <rect x="305" y="170" width="235" height="52" class="box" fill="#383a45" stroke="#e95420" />
  <text x="315" y="191" class="text-title">Ayatana Indicators</text>
  <text x="315" y="209" class="text-sub">Battery, Audio, Network, Clock, Messages</text>

  <rect x="560" y="170" width="290" height="52" class="box" fill="#383a45" stroke="#e95420" />
  <text x="570" y="191" class="text-title">Lomiri App Launch &amp; Lifecycle</text>
  <text x="570" y="209" class="text-sub">AppArmor MAC Sandboxing &amp; CGroups Freeze</text>

  <!-- Layer 3: Display Server & Wayland -->
  <rect x="30" y="250" width="840" height="85" rx="10" fill="#262830" stroke="#0e8420" stroke-width="1.5" />
  <text x="50" y="273" class="layer-title" fill="#44c758">DISPLAY SERVER &amp; COMPOSITING</text>

  <rect x="50" y="285" width="370" height="40" class="box" fill="#383a45" stroke="#0e8420" />
  <text x="60" y="310" class="text-title">Mir Display Server (Mir 2.x Wayland Compositor)</text>

  <rect x="440" y="285" width="410" height="40" class="box" fill="#383a45" stroke="#0e8420" />
  <text x="450" y="310" class="text-title">Wayland Protocols (xdg-shell, wlr-layer-shell, buffer sharing)</text>

  <!-- Layer 4: GNU/Linux Middleware & Daemons -->
  <rect x="30" y="350" width="840" height="95" rx="10" fill="#262830" stroke="#1976d2" stroke-width="1.5" />
  <text x="50" y="373" class="layer-title" fill="#42a5f5">GNU/LINUX MIDDLEWARE &amp; HARDWARE SERVICES</text>

  <rect x="50" y="385" width="145" height="48" class="box" fill="#383a45" stroke="#1976d2" />
  <text x="60" y="405" class="text-title">oFono</text>
  <text x="60" y="421" class="text-sub">Cellular &amp; Data RIL</text>

  <rect x="210" y="385" width="185" height="48" class="box" fill="#383a45" stroke="#1976d2" />
  <text x="220" y="405" class="text-title">PulseAudio / PipeWire</text>
  <text x="220" y="421" class="text-sub">Audio Routing &amp; Droid Sink</text>

  <rect x="410" y="385" width="145" height="48" class="box" fill="#383a45" stroke="#1976d2" />
  <text x="420" y="405" class="text-title">repowerd</text>
  <text x="420" y="421" class="text-sub">Power &amp; Display State</text>

  <rect x="570" y="385" width="135" height="48" class="box" fill="#383a45" stroke="#1976d2" />
  <text x="580" y="405" class="text-title">sensorfw</text>
  <text x="580" y="421" class="text-sub">Motion &amp; Orientation</text>

  <rect x="720" y="385" width="130" height="48" class="box" fill="#383a45" stroke="#1976d2" />
  <text x="730" y="405" class="text-title">NetworkManager</text>
  <text x="730" y="421" class="text-sub">WiFi, APN, Hotspot</text>

  <!-- Layer 5: Hardware Adaptation Bridge (Halium & libhybris) -->
  <rect x="30" y="460" width="840" height="85" rx="10" fill="#2d2218" stroke="#ff9800" stroke-width="1.8" />
  <text x="50" y="483" class="layer-title" fill="#ffa726">HARDWARE ADAPTATION (HALIUM &amp; LIBHYBRIS)</text>

  <rect x="50" y="495" width="370" height="40" class="box" fill="#443224" stroke="#ff9800" />
  <text x="60" y="520" class="text-title">libhybris (Bionic C &lt;-&gt; GNU glibc Dynamic Bridge)</text>

  <rect x="440" y="495" width="410" height="40" class="box" fill="#443224" stroke="#ff9800" />
  <text x="450" y="520" class="text-title">Halium Android Container (system.img, vendor.img HALs)</text>

  <!-- Layer 6: Kernel & Hardware -->
  <rect x="30" y="560" width="840" height="65" rx="10" fill="#1e2229" stroke="#78909c" stroke-width="1.5" />
  <text x="50" y="583" class="layer-title" fill="#90a4ae">LINUX KERNEL &amp; SILICON HARDWARE</text>
  <text x="50" y="610" class="text-sub" fill="#cfd8dc">Linux Kernel (Downstream Android GKI / Mainline) &#8226; Device Tree (DTB) &#8226; Proprietary GPU/Modem/WiFi Firmware Blobs</text>
</svg>
